
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Entry Form</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  padding: 15px;
  margin: 0;
}
.container {
  max-width: 450px;
  margin: 15px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
}
h2 {
  text-align: center;
  color: #1769aa;
}
input, button {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 7px;
  font-size: 16px;
}
input {
  border: 1px solid #ccc;
}
button {
  border: 0;
  background: #1769aa;
  color: white;
  font-weight: bold;
}
button:disabled {
  background: #999;
}
video, canvas, img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
#preview { display: none; }
#status {
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

<h2>Visitor Entry Form</h2>

<form id="visitorForm">

<input id="name" placeholder="Visitor Name *" required>

<input id="mobile" type="tel"
placeholder="Mobile Number *" required>

<input id="company" placeholder="Company Name">

<input id="person" placeholder="Person to Meet">

<input id="purpose" placeholder="Purpose of Visit">

<input id="vehicle" placeholder="Vehicle Number">

<h3>Visitor Selfie *</h3>

<video id="video" autoplay playsinline></video>

<canvas id="canvas" style="display:none"></canvas>

<img id="preview" alt="Selfie preview">

<button type="button" id="openBtn" onclick="openCamera()">
Open Front Camera
</button>

<button type="button" id="captureBtn"
onclick="capturePhoto()" disabled>
Capture Selfie
</button>

<button type="button" id="retakeBtn"
onclick="retakePhoto()" style="display:none">
Retake Selfie
</button>

<p id="photoStatus">Selfie not captured</p>

<button type="submit" id="submitBtn">
Submit Visitor Entry
</button>

</form>

<p id="status"></p>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzW443QnmTWJBkE08Lui662Z0PxiiKjQOdN23Q6Rn1fphX1nAiyLqLSedAR5EudCct4/exec";

let cameraStream = null;
let selfieImage = null;

async function openCamera() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera is not supported in this browser.");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "user" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = cameraStream;
    await video.play();

    document.getElementById("captureBtn").disabled = false;
    document.getElementById("openBtn").disabled = true;
    document.getElementById("status").innerText =
      "Camera ready. Capture your selfie.";

  } catch (error) {
    alert("Camera error: " + error.message);
  }
}

function capturePhoto() {
  const video = document.getElementById("video");

  if (!cameraStream || !video.videoWidth) {
    alert("Please open camera first.");
    return;
  }

  const canvas = document.getElementById("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  selfieImage = canvas.toDataURL("image/jpeg", 0.75);

  document.getElementById("preview").src = selfieImage;
  document.getElementById("preview").style.display = "block";
  video.style.display = "none";

  cameraStream.getTracks().forEach(track => track.stop());
  cameraStream = null;

  document.getElementById("captureBtn").style.display = "none";
  document.getElementById("retakeBtn").style.display = "block";

  document.getElementById("photoStatus").innerText =
    "Selfie captured successfully!";
}

function retakePhoto() {
  selfieImage = null;

  document.getElementById("preview").style.display = "none";
  document.getElementById("video").style.display = "block";

  document.getElementById("captureBtn").style.display = "block";
  document.getElementById("captureBtn").disabled = true;
  document.getElementById("retakeBtn").style.display = "none";
  document.getElementById("openBtn").disabled = false;

  document.getElementById("photoStatus").innerText =
    "Selfie not captured";

  openCamera();
}

document.getElementById("visitorForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  if (!selfieImage) {
    alert("Please capture visitor selfie first.");
    return;
  }

  const data = {
    name: document.getElementById("name").value.trim(),
    mobile: document.getElementById("mobile").value.trim(),
    company: document.getElementById("company").value.trim(),
    person: document.getElementById("person").value.trim(),
    purpose: document.getElementById("purpose").value.trim(),
    vehicle: document.getElementById("vehicle").value.trim(),
    photo: selfieImage
  };

  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  btn.disabled = true;
  btn.innerText = "Submitting...";
  status.innerText = "Sending visitor entry...";

  try {

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    status.innerText =
      "Request sent. Please verify visitor entry in Google Sheets.";

    // Keep form and photo until the save is verified.
    btn.disabled = false;
    btn.innerText = "Submit Visitor Entry";

  } catch (error) {

    status.innerText = "Network error: " + error.message;
    btn.disabled = false;
    btn.innerText = "Submit Visitor Entry";

  }
});

</script>
</body>
</html>
